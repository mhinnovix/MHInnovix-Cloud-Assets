# 📁 PATH (repo: mhinnovix/MHInnovix-Cloud-Assets): .github/workflows/notice-hub.yml
#
# NoticeTexts/ ba NoticeDocuments/ -e push holei (bot ba haat diye):
#   1. validate — bhul thakle FAIL → index publish hoy na → app-e ager thik data-i thake
#   2. auto ID + date ISO + addedAt/updatedAt stamp
#   3. index.json (commit SHA "ref" shoho → month file URL immutable, CDN stale hoy na)
#   4. push + jsDelivr purge
name: Notice Hub — validate & publish

on:
  push:
    branches: [main]
    paths:
      - "HPRC_Scanner/NoticeHub/NoticeTexts/**"
      - "HPRC_Scanner/NoticeHub/NoticeDocuments/**"
      - ".github/scripts/notice_hub.py"
      - ".github/workflows/notice-hub.yml"
  workflow_dispatch:
    inputs:
      min_app_version:
        description: "Minimum app versionCode for Notice Hub (blank = keep current)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: notice-hub-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate & stamp notices
        run: python .github/scripts/notice_hub.py normalize

      - name: Commit stamped notices
        run: |
          git config user.name "notice-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A HPRC_Scanner/NoticeHub
          if ! git diff --cached --quiet; then
            git commit -m "NoticeHub: stamp ids / addedAt / updatedAt"
          fi

      - name: Build index.json
        env:
          MIN_APP_VERSION: ${{ github.event.inputs.min_app_version }}
        run: python .github/scripts/notice_hub.py index --ref "$(git rev-parse HEAD)"

      - name: Commit & push
        run: |
          git add HPRC_Scanner/NoticeHub/index.json
          if ! git diff --cached --quiet; then
            git commit -m "NoticeHub: publish index"
          fi
          git push origin HEAD:main

      # jsDelivr purono index jate na dey: purge → jsDelivr notun index dicche kina MILIYE dekha → na hole abar।
      # (Push-er shathe shathe purge korle GitHub raw tokhono purono thakte pare, jsDelivr shetai tule nito।)
      - name: Refresh jsDelivr cache (verified)
        run: |
          IDX=HPRC_Scanner/NoticeHub/index.json
          want=$(python -c "import json;print(json.load(open('$IDX'))['generatedAt'])")
          cdn="https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/$IDX"
          purge="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$IDX"
          for i in $(seq 1 20); do
            curl -fsS "$purge" > /dev/null || true
            sleep 15
            got=$(curl -fsS "$cdn" | python -c "import sys,json;print(json.load(sys.stdin).get('generatedAt',''))" 2>/dev/null || true)
            if [ "$got" = "$want" ]; then echo "jsDelivr is serving the new index ✅"; exit 0; fi
            echo "jsDelivr still has '$got' (want '$want') — retry $i/20"
            sleep 15
          done
          echo "::warning::jsDelivr not fresh after ~10 min — open the purge link once by hand"
