# 📁 PATH (repo: mhinnovix/MHInnovix-Cloud-Assets): .github/workflows/notice-hub.yml
#
# NoticeTexts/ ba NoticeDocuments/ -e push holei (bot ba haat diye):
#   1. validate — bhul thakle FAIL → index publish hoy na → app-e ager thik data-i thake
#   2. auto ID + date ISO + addedAt/updatedAt stamp
#   3. index.json (commit SHA "ref" shoho → month file URL immutable, CDN stale hoy na)
#   4. push + index.json GitHub Pages-e deploy (app ekhan theke pore)
#
# 🟢 Safe push: admin app jodi ei run cholar majhe notun commit dey, push reject hoy.
#    Tokhon rebase (conflict-er jhuki) na kore → latest main abar nie → normalize + index
#    abar chalay → abar push. Script idempotent, tai protibar result thik thake.
#    (NoticeDocumentsBin/ trigger path-e nei → app-er archive commit run start kore na)
name: Notice Hub — validate & publish

on:
  push:
    branches: [main]
    paths:
      - "HPRC_Scanner/NoticeHub/NoticeTexts/**"
      - "HPRC_Scanner/NoticeHub/NoticeDocuments/**"
      - ".github/scripts/notice_hub.py"
      - ".github/workflows/notice-hub.yml"
  workflow_dispatch:
    inputs:
      min_app_version:
        description: "Minimum app versionCode for Notice Hub (blank = keep current)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: notice-hub-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate, stamp, build index & push (retry on race)
        env:
          MIN_APP_VERSION: ${{ github.event.inputs.min_app_version }}
        run: |
          set -euo pipefail
          git config user.name "notice-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "::group::Attempt $attempt"
            # Always start from the newest main (admin app may have pushed meanwhile)
            git fetch --quiet origin main
            git reset --hard origin/main

            # 1+2. validate & stamp (exits non-zero on validation error → whole job fails, nothing published)
            python .github/scripts/notice_hub.py normalize
            git add -A HPRC_Scanner/NoticeHub
            if ! git diff --cached --quiet; then
              git commit -q -m "NoticeHub: stamp ids / addedAt / updatedAt"
            fi

            # 3. index.json pinned to the commit that contains these month files
            python .github/scripts/notice_hub.py index --ref "$(git rev-parse HEAD)"
            git add HPRC_Scanner/NoticeHub/index.json
            if ! git diff --cached --quiet; then
              git commit -q -m "NoticeHub: publish index"
            fi

            # 4. push — success → done
            if git push origin HEAD:main; then
              echo "::endgroup::"
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::main moved while publishing (attempt $attempt) — retrying from latest main"
            sleep $((attempt * 5))
          done

          echo "::error::Could not push after 5 attempts"
          exit 1

      # index.json GitHub Pages-e (free CDN, cache ~10 min, onek user-er jonno banano)।
      # Shudhu ei ekta choto file — baki shob jsDelivr @<commit SHA> theke ase, ja kokhono stale hoy na।
      - name: Prepare Pages site (index.json only)
        run: |
          mkdir -p _site/NoticeHub
          cp HPRC_Scanner/NoticeHub/index.json _site/NoticeHub/index.json
          touch _site/.nojekyll

      # Protiti attempt-er artifact-er naam alada — "Re-run" korleo duita ek naam-er artifact hoy na
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
