# 📁 PATH (repo: mhinnovix/MHInnovix-Cloud-Assets): .github/workflows/notice-hub.yml
#
# NoticeTexts/ ba NoticeDocuments/ -e push holei (bot ba haat diye):
#   1. validate — bhul thakle FAIL → index publish hoy na → app-e ager thik data-i thake
#   2. auto ID + date ISO + addedAt/updatedAt stamp
#   3. index.json (commit SHA "ref" shoho → month file URL immutable, CDN stale hoy na)
#   4. push + index.json GitHub Pages-e deploy (app ekhan theke pore)
name: Notice Hub — validate & publish

on:
  push:
    branches: [main]
    paths:
      - "HPRC_Scanner/NoticeHub/NoticeTexts/**"
      - "HPRC_Scanner/NoticeHub/NoticeDocuments/**"
      - ".github/scripts/notice_hub.py"
      - ".github/workflows/notice-hub.yml"
  workflow_dispatch:
    inputs:
      min_app_version:
        description: "Minimum app versionCode for Notice Hub (blank = keep current)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: notice-hub-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate & stamp notices
        run: python .github/scripts/notice_hub.py normalize

      - name: Commit stamped notices
        run: |
          git config user.name "notice-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A HPRC_Scanner/NoticeHub
          if ! git diff --cached --quiet; then
            git commit -m "NoticeHub: stamp ids / addedAt / updatedAt"
          fi

      - name: Build index.json
        env:
          MIN_APP_VERSION: ${{ github.event.inputs.min_app_version }}
        run: python .github/scripts/notice_hub.py index --ref "$(git rev-parse HEAD)"

      - name: Commit & push
        run: |
          git add HPRC_Scanner/NoticeHub/index.json
          if ! git diff --cached --quiet; then
            git commit -m "NoticeHub: publish index"
          fi
          git push origin HEAD:main

      # index.json GitHub Pages-e (free CDN, cache ~10 min, onek user-er jonno banano)।
      # Shudhu ei ekta choto file — baki shob jsDelivr @<commit SHA> theke ase, ja kokhono stale hoy na।
      - name: Prepare Pages site (index.json only)
        run: |
          mkdir -p _site/NoticeHub
          cp HPRC_Scanner/NoticeHub/index.json _site/NoticeHub/index.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
